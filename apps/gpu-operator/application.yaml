apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  sources:
    - repoURL: https://helm.ngc.nvidia.com/nvidia
      chart: gpu-operator
      targetRevision: v24.9.2
      helm:
        releaseName: gpu-operator
        values: |
          driver:
            enabled: false
          toolkit:
            enabled: false
          devicePlugin:
            enabled: false
          gfd:
            enabled: false
          migManager:
            enabled: false
          validator:
            enabled: false
          dcgmExporter:
            enabled: false
    - repoURL: https://github.com/dwetmore/gpu-observability-gitops.git
      targetRevision: main
      path: apps/gpu-operator/extras
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
