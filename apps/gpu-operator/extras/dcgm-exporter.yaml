apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-dcgm-exporter-metrics
  labels:
    app.kubernetes.io/name: nvidia-dcgm-exporter
data:
  dcgm-metrics.csv: |
    # Format: <metric>, <type>, <help>
    DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (in %).
    DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory copy utilization (in %).
    DCGM_FI_DEV_ENC_UTIL, gauge, Encoder utilization (in %).
    DCGM_FI_DEV_DEC_UTIL, gauge, Decoder utilization (in %).
    DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
    DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
    DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (in C).
    DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (in W).
    DCGM_FI_DEV_POWER_MGMT_LIMIT, gauge, Configured power limit (in W).
    DCGM_FI_DEV_SM_CLOCK, gauge, SM clock (in MHz).
    DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock (in MHz).
    DCGM_FI_DEV_PCIE_TX_THROUGHPUT, gauge, PCIe TX throughput.
    DCGM_FI_DEV_PCIE_RX_THROUGHPUT, gauge, PCIe RX throughput.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-dcgm-exporter
  namespace: gpu-operator
  labels:
    app.kubernetes.io/name: nvidia-dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-dcgm-exporter
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /etc/dcgm-exporter/dcgm-metrics.csv
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          volumeMounts:
            - name: metrics-config
              mountPath: /etc/dcgm-exporter
              readOnly: true
      volumes:
        - name: metrics-config
          configMap:
            name: nvidia-dcgm-exporter-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-dcgm-exporter
  namespace: gpu-operator
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: nvidia-dcgm-exporter
spec:
  selector:
    app.kubernetes.io/name: nvidia-dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-dcgm-exporter
  namespace: gpu-operator
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: nvidia-dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-dcgm-exporter
  namespaceSelector:
    matchNames:
      - gpu-operator
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
