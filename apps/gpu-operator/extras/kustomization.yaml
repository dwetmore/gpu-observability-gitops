apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpu-operator
configMapGenerator:
  - name: dcgm-metrics
    files:
      - dcgm-metrics.csv
generatorOptions:
  disableNameSuffixHash: true
resources:
  - nvidia-dcgm-exporter-daemonset.yaml
  - nvidia-dcgm-exporter-service.yaml
  - nvidia-dcgm-exporter-servicemonitor.yaml
